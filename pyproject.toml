[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "send-it-slowly"
version = "0.1.0"
description = "Video tooling for the send.it.slowly motorcycle channel"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.overlays" = ["assets/*"]
"app.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders minutes of real video; deselect with -m \"not slow\""]
